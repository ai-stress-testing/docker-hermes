# Standalone nginx.conf for the Hermes static UI image.
#
# Written to support a read-only root filesystem: every path nginx needs
# to write to (pid file, client/proxy/fastcgi/uwsgi/scgi temp dirs) lives
# under /tmp, which docker-compose.yml mounts as a tmpfs. Everything else
# (site config, static assets) ships baked into the read-only image layer.
# /run/hermes-config is a second tmpfs mount: the one file the container
# writes at startup (config.js, rendered from BACKEND_URL by
# docker-entrypoint.d/20-hermes-config.sh) lives there instead of under
# /usr/share/nginx/html, so the static asset directory itself never needs
# to be writable.
#
# /v1/ is reverse-proxied to the backend service on hermes-net. The
# browser only ever talks to this container (same origin as the UI);
# backend stays off the host entirely. This is what makes the default
# BACKEND_URL="" (relative fetches) actually reach the backend.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hides the nginx version from the Server header and default error
    # pages (minor fingerprinting hardening).
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile     on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Rendered at container startup from BACKEND_URL; see
        # docker-entrypoint.d/20-hermes-config.sh. Never cache this file.
        location = /config.js {
            add_header Cache-Control "no-store";
            alias /run/hermes-config/config.js;
        }

        # Reverse-proxy to the backend service (internal Docker DNS name,
        # not resolvable outside hermes-net). proxy_read_timeout,
        # proxy_send_timeout and client_max_body_size are NOT hardcoded
        # here: they're rendered at container startup, from the same
        # REQUEST_TIMEOUT / MAX_REQUEST_BODY_BYTES env vars the backend
        # itself reads, into /tmp/hermes-proxy.conf (see
        # docker-entrypoint.d/20-hermes-config.sh). A hardcoded value here
        # previously desynced from those env vars the moment either was
        # changed — this keeps them derived from one source, not two
        # copies that can drift.
        location /v1/ {
            proxy_pass http://backend:8000/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            include /tmp/hermes-proxy.conf;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
