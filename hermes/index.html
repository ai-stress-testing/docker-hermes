<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Hermes</h1>
    </header>

    <main id="conversation" aria-live="polite"></main>

    <p id="status-bar" role="status"></p>

    <form id="composer">
      <textarea
        id="message-input"
        placeholder="Type a message..."
        rows="2"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="send-button">Send</button>
    </form>
  </div>

  <!-- config.js is loaded first so a container can override it -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
